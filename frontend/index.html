<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/iconn.png" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>StockViewAI – Stock Market Learning Platform</title>

    <meta
      name="description"
      content="StockViewAI is a beginner-friendly stock market learning platform offering real-time stock data, interactive charts, AI-powered stock analysis, price alerts, and financial calculators."
    />

    <meta
      name="keywords"
      content="StockViewAI, stock market, stock analysis, stock learning, NSE stocks, stock charts, AI stock analysis, stock price alerts, financial calculator"
    />

    <meta name="author" content="StockViewAI" />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Browser Theme -->
    <meta name="theme-color" content="#69a79c" />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="StockViewAI – Stock Market Learning Platform"
    />

    <meta
      property="og:description"
      content="Learn and explore the stock market with real-time stock data, interactive charts, AI-powered analysis, alerts, and financial calculators."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="/iconn.png"
    />

    <!-- Twitter Card -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="StockViewAI – Stock Market Learning Platform"
    />

    <meta
      name="twitter:description"
      content="A beginner-friendly platform for learning and analyzing the stock market with real-time data and AI-powered insights."
    />

    <meta
      name="twitter:image"
      content="/iconn.png"
    />
